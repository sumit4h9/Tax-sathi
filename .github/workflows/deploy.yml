name: Deploy TaxSathi to AWS EC2 & Auto Scaling Group via ECR

on:
  push:
    branches:
      - main

env:
  ECR_BACKEND_REPOSITORY: taxsathi-backend
  ECR_FRONTEND_REPOSITORY: taxsathi-frontend

jobs:
  test:
    name: Run Linting and Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mongodb, gd
          coverage: none

      - name: Validate Composer Dependencies
        run: |
          cd backend
          composer validate --no-check-lock

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Check Build
        run: |
          cd frontend
          npm ci
          npm run build

  build-and-deploy:
    name: Build Docker Images, Push to ECR, & Deploy to AWS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest || true
          docker build --cache-from $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

      - name: Build, Tag, and Push Frontend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest || true
          docker build --cache-from $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

      - name: Deploy to Auto Scaling Group (Instance Refresh)
        run: |
          echo "Starting Auto Scaling Group Instance Refresh for taxsathi-asg..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name taxsathi-asg \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}' \
            --region ${{ secrets.AWS_REGION }}
